<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Espia Fácil — Criar Conta</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- Matrix Rain Canvas -->
  <canvas id="matrix-canvas"></canvas>

  <div class="login-page">

    <div class="glass-card animate-in">
      <!-- Brand Logo -->
      <img src="https://i.postimg.cc/nLWZtq6q/Favicon2.png" alt="Espia Fácil" class="brand-logo">

      <!-- Alert -->
      <div class="alert alert-error" id="form-alert">
        <span>⚠</span>
        <span id="alert-msg">Preencha todos os campos corretamente.</span>
      </div>

      <!-- Title -->
      <h1 class="section-title">Crie sua Conta</h1>
      <p class="section-subtitle">Acesse o painel de investigação agora</p>

      <!-- Form -->
      <form id="register-form" novalidate>

        <div class="form-group">
          <label class="form-label" for="name">Nome Completo</label>
          <input type="text" id="name" class="form-input" placeholder="Seu nome completo" autocomplete="name" />
          <span class="field-error" id="name-error">Nome é obrigatório.</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">E-mail</label>
          <input type="email" id="email" class="form-input" placeholder="seu@email.com" autocomplete="email" />
          <span class="field-error" id="email-error">Informe um e-mail válido.</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="email-confirm">Confirmar E-mail</label>
          <input type="email" id="email-confirm" class="form-input" placeholder="Confirme seu e-mail" autocomplete="email" />
          <span class="field-error" id="email-confirm-error">Os e-mails não coincidem.</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Senha</label>
          <input type="password" id="password" class="form-input" placeholder="Mínimo 6 caracteres" autocomplete="new-password" />
          <span class="field-error" id="password-error">Senha deve ter pelo menos 6 caracteres.</span>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn">
          <span class="btn-text">Criar Conta Gratuitamente</span>
        </button>

      </form>

      <p class="section-subtitle" style="margin-top: 20px; font-size: 0.8rem;">
        Já possui uma conta? <a href="dashboard.html" class="text-accent">Entrar</a>
      </p>
    </div>

    <p class="page-footer">ESPIA FÁCIL v4.0 — © 2025 Intelligence Systems</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
